{% extends "base.html" %}

{% block content %}
<div x-data="holdings">
    <div class="flex justify-between items-center mb-4">
        <h1>Holdings</h1>
        <button class="btn btn-primary" @click="fetchData()">Refresh</button>
    </div>

    <div class="card table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Qty</th>
                    <th>Avg. Price</th>
                    <th>LTP</th>
                    <th>P&L</th>
                    <th>P&L %</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="holding in holdings" :key="holding.symbol">
                    <tr>
                        <td x-text="holding.symbol" class="font-bold"></td>
                        <td x-text="holding.quantity"></td>
                        <td x-text="formatCurrency(holding.average_price)"></td>
                        <td x-text="formatCurrency(holding.ltp)"></td>
                        <td :class="getColorClass(holding.pnl)" x-text="formatCurrency(holding.pnl)"></td>
                        <td :class="getColorClass(holding.pnl_percent)" x-text="formatPercentage(holding.pnl_percent)"></td>
                    </tr>
                </template>
                <tr x-show="holdings.length === 0 && !loading">
                    <td colspan="6" class="text-center text-secondary">No holdings found</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
