{% extends "base.html" %}

{% block content %}
<div x-data="marketSummary">
    <div class="flex justify-between items-center mb-4">
        <h1>Dashboard</h1>
        <div class="text-sm text-secondary">
            Last Updated: <span x-text="new Date().toLocaleTimeString()"></span>
        </div>
    </div>

    <!-- Market Indices -->
    <div class="grid grid-cols-4 mb-4">
        <template x-for="index in indices" :key="index.symbol">
            <div class="card">
                <div class="text-secondary text-sm" x-text="index.symbol"></div>
                <div class="text-2xl font-bold mt-2" x-text="formatCurrency(index.ltp)"></div>
                <div class="flex items-center mt-1" :class="getColorClass(index.change)">
                    <span x-text="index.change > 0 ? '▲' : '▼'" class="mr-1"></span>
                    <span x-text="index.change"></span>
                    <span class="ml-1 text-sm" x-text="'(' + formatPercentage(index.change_percent) + ')'"></span>
                </div>
            </div>
        </template>
    </div>

    <div class="grid grid-cols-2">
        <!-- Market Breadth -->
        <div class="card">
            <h3>Market Breadth</h3>
            <div class="flex items-center justify-center h-40">
                <div class="text-center mr-8">
                    <div class="text-3xl font-bold text-success" x-text="advancers"></div>
                    <div class="text-secondary">Advancers</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-danger" x-text="decliners"></div>
                    <div class="text-secondary">Decliners</div>
                </div>
            </div>
        </div>

        <!-- Top Movers -->
        <div class="card">
            <h3>Top Movers</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <h4 class="text-success text-sm mb-2">Top Gainers</h4>
                    <template x-for="gainer in topGainers" :key="gainer.symbol">
                        <div class="flex justify-between items-center mb-2 p-2 rounded bg-opacity-10 bg-green-500">
                            <span x-text="gainer.symbol"></span>
                            <span class="text-success" x-text="formatPercentage(gainer.change_percent)"></span>
                        </div>
                    </template>
                </div>
                <div>
                    <h4 class="text-danger text-sm mb-2">Top Losers</h4>
                    <template x-for="loser in topLosers" :key="loser.symbol">
                        <div class="flex justify-between items-center mb-2 p-2 rounded bg-opacity-10 bg-red-500">
                            <span x-text="loser.symbol"></span>
                            <span class="text-danger" x-text="formatPercentage(loser.change_percent)"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
