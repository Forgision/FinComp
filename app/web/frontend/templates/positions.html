{% extends "base.html" %}

{% block content %}
<div x-data="positions">
    <div class="flex justify-between items-center mb-4">
        <h1>Positions</h1>
        <button class="btn btn-primary" @click="fetchData()">Refresh</button>
    </div>

    <div class="card table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Qty</th>
                    <th>Avg. Price</th>
                    <th>LTP</th>
                    <th>P&L</th>
                    <th>P&L %</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="position in positions" :key="position.symbol">
                    <tr>
                        <td x-text="position.symbol" class="font-bold"></td>
                        <td x-text="position.quantity"></td>
                        <td x-text="formatCurrency(position.average_price)"></td>
                        <td x-text="formatCurrency(position.ltp)"></td>
                        <td :class="getColorClass(position.pnl)" x-text="formatCurrency(position.pnl)"></td>
                        <td :class="getColorClass(position.pnl_percent)" x-text="formatPercentage(position.pnl_percent)"></td>
                    </tr>
                </template>
                <tr x-show="positions.length === 0 && !loading">
                    <td colspan="6" class="text-center text-secondary">No open positions</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
